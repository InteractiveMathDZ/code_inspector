---
layout: default
title: "Direct Code Inspector | Code Inspector"
---
<h1>Direct Code Inspection</h1>

<div class="input-section"> 
    
    <!-- Label is outside the wrapper -->
    <label for="codeInput">Enter Source Code</label>
    <div class="editor-wrapper">
        <div id="lineNumbers" class="line-numbers">1</div>
        <textarea id="codeInput" placeholder="Paste your source code here for analysis..." wrap="off" spellcheck="false"></textarea>
    </div>

    <label for="toolSelect">Select Inspection Tool</label>
    <!-- Tool selection dropdown -->
    <select id="toolSelect">
        <option value="Python AST">Python AST</option>
        <option value="ESLint">ESLint</option>
        <option value="Bandit">Bandit</option> 
        <option value="PyFlakes">PyFlakes</option>
        <option value="Complexity">Radon Complexity</option>
        <option value="PEP8">PyCodeStyle</option>
        <option value="HTMLValidate">HTMLValidate</option>
        <option value="Stylelint">Stylelint</option>
    </select>

    <div class="actions-group">
        <button id="clearBtn" type="button">🗑️ Clear Code</button>
        <button id="copyBtn" type="button">📋 Copy Code</button>
    </div>

    <div class="actions-group">
        <button id="inspectBtn" type="button">🔍 Inspect Code</button>
        <button id="formatBtn" type="button">✨ Format Code</button>
    </div>
</div>
