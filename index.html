title: "فاحص كود | Code Inspector."

<h1>Code Inspector</h1>
<div class="input-section"> 
    <!-- قائمة اختيار اللغة -->
    <select id="languageSelect" class="selectstyle" dir="ltr">
        <option value="pythonast">PythonAST</option>
        <option value="eslint">ESLint</option>
        <option value="semgrep">semgrep</option>
    </select>

    <textarea id="codeInput" dir="ltr" placeholder="ألصق الكود الخاص بك هنا للتحليل..."></textarea>
    <button id="inspectBtn" onclick="inspectCode()">فحص الكود</button>
</div>
<div id="reportOutput"></div>
