---
layout: default
title: "فاحص كود | Code Inspector."
---
<h1>Code Inspector</h1>

<div class="input-section"> 
    <!-- قائمة اختيار اللغة بنفس مفاتيح الباك إند الحالية -->
    <label for="toolSelect">اختر وسيلة الفحص.</label>
    <select id="toolSelect" dir="ltr">
        <option value="python AST">Python AST</option>
        <option value="ESLint">ESLint</option>
        <option value="Bandit">Bandit</option> 
        <option value="PyFlakes">PyFlakes</option>
        <option value="Complexity">Radon.Complexity</option>
        <option value="PEP8">PyCodeStyle</option>
        <option value="HTMLValidate">HTMLValidate</option>
        <option value="Stylelint">Stylelint</option>
    </select>

    <label for="codeInput">أدخل الكود البرمجي المراد فحصه.</label>
    <textarea id="codeInput" dir="ltr" placeholder="ألصق الكود الخاص بك هنا للتحليل..."></textarea>
    
    <button id="inspectBtn" type="button">فحص الكود</button>
</div>

<!-- حاوية النتائج الرئيسية -->
<div id="results"></div>

<!-- قالب التنبيهات والرسائل العامة -->
<template id="alert-template">
  <div class="alert-box">
    <strong class="alert-title"></strong>
    <p class="alert-message"></p>
  </div>
</template>

<!-- قالب بطاقة الخطأ/التنبيه المنفرد -->
<template id="issue-template">
  <div class="issue-item">
    <div class="issue-header">
      <span class="issue-location"></span>
      <span class="issue-badge"></span>
    </div>
    <p class="issue-message" dir="ltr"></p>
    <small class="issue-rule" dir="ltr"></small>
  </div>
</template>
