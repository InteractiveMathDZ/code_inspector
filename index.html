---
layout: default
title: "Direct Code Inspector | Code Inspector"
---
<!-- <h1>Direct Code Inspection</h1> -->

<div class="workbench-container">
  
<!-- 1. الشريط العلوي الثابت (Sticky Top Header) -->
<header class="editor-header">
    <div class="lang-selector-group">
      <label for="languageSelect" class="sr-only">اختر اللغة</label>
      <select id="languageSelect" class="lang-dropdown">
        <option value="python">🐍 Python</option>
        <option value="javascript">⚡ JavaScript</option>
        <option value="css">🎨 CSS</option>
        <option value="html">🌐 HTML</option>
      </select>
    </div>

    <!-- أزرار الإجراءات الثانوية كأيقونات سريعة -->
    <div class="quick-tools">
      <button type="button" id="copyBtn" class="icon-btn" title="نسخ الكود">
        📋 <span class="btn-text">copy</span>
      </button>
      <button type="button" id="clearBtn" class="icon-btn danger" title="مسح المحرر">
        🗑️ <span class="btn-text">clear</span>
      </button>
    </div>
  </header>

  <!-- 2. منطقة المحرر القابلة للتمرير (Scrollable Editor Body) -->
  <main class="editor-body">
    <div class="editor-wrapper">
        <div id="lineNumbers" class="line-numbers">1</div>
        <textarea 
            id="codeInput" 
            placeholder="Paste your source code here for analysis..."
            spellcheck="false"
        ></textarea>
    </div>
  </main>

  <!-- 3. الشريط السفلي الثابت للأزرار الرئيسية (Sticky Bottom Footer) -->
  <footer class="editor-footer">
    <button type="button" id="inspectBtn" class="action-btn btn-inspect">
      🔍 Inspect
    </button>
    <button type="button" id="formatBtn" class="action-btn btn-format">
      ✨ Format
    </button>
  </footer>

</div>

<!-- منطقة إظهار النتائج أسفل المحرر -->
<section id="results" class="results-container hidden"></section>
