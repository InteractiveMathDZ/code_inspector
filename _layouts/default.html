<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    {%- include analytics.html -%}
    <meta charset="UTF-8">
    {%- include site_version.html -%}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    {%- include head_links.html -%}
  </head>
  <body>
    <div class="container main-content-wrapper">
      <h1>Code Inspector</h1>
      {%- include sidebar.html -%}
      {{ content }}

      <template id="alert-template">
          <div class="alert-box">
              <strong class="alert-title"></strong>
              <p class="alert-message"></p>
          </div>
      </template>

      <template id="issue-template">
          <div class="issue-item">
              <div class="issue-header">
                  <span class="issue-location"></span>
                  <span class="issue-badge"></span>
              </div>
              <p class="issue-message" dir="ltr"></p>
              <small class="issue-rule" dir="ltr"></small>
           </div>
        </template>
    </div>
    
    {%- include footer.html -%}
    {%- include scripts.html -%}
  </body>
</html>
