<!-- Side launch button -->
<button
  class="btn shadow position-fixed start-0 translate-middle-y rounded-end-pill border chatwideget-button-style"
  type="button"
  data-bs-toggle="offcanvas"
  data-bs-target="#chat-widget"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 16 16" stroke="#3b82f6" stroke-width="2" class="bi bi-list-ul">
    <path transform="scale(0.666667)" stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
  </svg>

  <span class="visually-hidden">Chat bot</span>
</button>


<!-- SideBar, chat window -->
<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="chat-widget"
  aria-labelledby="chatwidgetLabel"
>
    <!-- window header -->
    <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="chatwidgetLabel">محادثة آلية</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
      aria-label="close"
    >
      <span class="visually-hidden">Close cha bot window</span>
    </button>
    </div>

    <!-- Messagesdisplay area -->
    <div id="ai-chat-messages">
        <div class="bot-message">
          Welcome! How can I help you with the content of this website today?
        </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
        <input type="text" 
          id="ai-chat-input" 
          placeholder="your prompt here..."
        >
        <button id="ai-chat-send-btn">
          Send
        </button>
    </div>
</div>
